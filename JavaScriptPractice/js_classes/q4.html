<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Form Builder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        form {
            width: 350px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 8px 15px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h2>Custom Form Builder</h2>

    <div id="formContainer"></div>

    <div id="result"></div>

    <script>
        "use strict";

        class FormBuilder {
            // Store the field configuration and form container
            constructor(fields, containerId) {
                this.fields = fields;
                this.container = document.getElementById(containerId);
            }

            // Create the form dynamically using innerHTML
            buildForm() {
                let formHTML = `<form id="customForm">`;

                this.fields.forEach(field => {
                    formHTML += `
                        <label for="${field.name}">${field.label}</label>
                        <input
                            type="${field.type}"
                            id="${field.name}"
                            name="${field.name}"
                            placeholder="Enter ${field.label}"
                        >
                    `;
                });

                formHTML += `
                    <button type="submit">Submit</button>
                </form>`;

                this.container.innerHTML = formHTML;

                // Handle form submission
                document.getElementById("customForm").addEventListener("submit", (event) => {
                    event.preventDefault();

                    const formData = this.getFormData();

                    console.log("Form Data:", formData);

                    document.getElementById("result").innerHTML =
                        `<h3>Submitted Data:</h3><pre>${JSON.stringify(formData, null, 2)}</pre>`;
                });
            }

            // Return all entered form values as an object
            getFormData() {
                const form = document.getElementById("customForm");
                const data = {};

                this.fields.forEach(field => {
                    data[field.name] = form.elements[field.name].value;
                });

                return data;
            }
        }

        // Define the fields for the dynamic form
        const fields = [
            {
                type: "text",
                label: "Username",
                name: "username"
            },
            {
                type: "email",
                label: "Email",
                name: "email"
            },
            {
                type: "number",
                label: "Age",
                name: "age"
            },
            {
                type: "password",
                label: "Password",
                name: "password"
            }
        ];

        // Create FormBuilder object
        const formBuilder = new FormBuilder(fields, "formContainer");

        // Generate the form
        formBuilder.buildForm();
    </script>

</body>
</html>
