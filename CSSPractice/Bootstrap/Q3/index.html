<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Products</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="bg-dark text-white p-3">
        <div class="container text-center">
            <h1>ShopEase</h1>
            <p class="mb-0">Find Your Favorite Products</p>
        </div>
    </header>

    <main class="container py-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <!-- Product Grid -->
        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x220?text=Headphones"
                        class="card-img-top" alt="Headphones">
                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="text-primary fw-bold">₹1,499</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x220?text=Smartwatch"
                        class="card-img-top" alt="Smartwatch">
                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="text-primary fw-bold">₹2,499</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x220?text=Speaker"
                        class="card-img-top" alt="Bluetooth Speaker">
                    <div class="card-body text-center">
                        <h5 class="card-title">Bluetooth Speaker</h5>
                        <p class="text-primary fw-bold">₹999</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://placehold.co/300x220?text=Keyboard"
                        class="card-img-top" alt="Keyboard">
                    <div class="card-body text-center">
                        <h5 class="card-title">Mechanical Keyboard</h5>
                        <p class="text-primary fw-bold">₹1,899</p>
                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 ShopEase. All Rights Reserved.</p>
    </footer>

</body>
</html>
