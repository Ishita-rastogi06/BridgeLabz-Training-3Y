<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips.</p>
    </header>

    <!-- Main content -->
    <main>

        <section class="tooltip-container">

            <!-- Tooltip example 1 -->
            <div class="tooltip-box">
                <span class="tooltip-text">This is a Home icon</span>
                <div class="icon">🏠</div>
            </div>

            <!-- Tooltip example 2 -->
            <div class="tooltip-box">
                <span class="tooltip-text">This is a Search icon</span>
                <div class="icon">🔍</div>
            </div>

            <!-- Tooltip example 3 -->
            <div class="tooltip-box">
                <span class="tooltip-text">This is a Settings icon</span>
                <div class="icon">⚙️</div>
            </div>

            <!-- Tooltip example 4 -->
            <div class="tooltip-box">
                <span class="tooltip-text">This word represents learning</span>
                <div class="word">Learn</div>
            </div>

        </section>

    </main>

    <!-- Footer section -->
    <footer>
        <p>CSS Tooltip Practice</p>
    </footer>

</body>
</html>
