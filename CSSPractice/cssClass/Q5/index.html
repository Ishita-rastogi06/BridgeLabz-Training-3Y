```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS.</p>
    </header>

    <!-- Main content -->
    <main>

        <section class="button-section">

            <h2>Button Styles</h2>

            <!-- Button collection -->
            <div class="button-container">

                <!-- Primary button -->
                <button class="btn primary">
                    Primary Button
                </button>

                <!-- Secondary button -->
                <button class="btn secondary">
                    Secondary Button
                </button>

                <!-- Outline button -->
                <button class="btn outline">
                    Outline Button
                </button>

                <!-- Disabled button -->
                <button class="btn disabled" disabled>
                    Disabled Button
                </button>

            </div>

            <p class="info">
                Hover over the buttons to see the hover effect.
                Click or use Tab to see the focus effect.
            </p>

        </section>

    </main>

    <!-- Footer section -->
    <footer>
        <p>CSS Button Collection Practice</p>
    </footer>

</body>
</html>
```
