<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Explore different CSS filters</p>
    </header>

    <!-- Main content -->
    <main>
        <section class="gallery-section">
            <h2>CSS Filter Gallery</h2>

            <!-- Image gallery using CSS Grid -->
            <div class="gallery">

                <figure class="gallery-item">
                    <img class="blur" 
                         src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80" 
                         alt="Mountain landscape">
                    <figcaption>Blur Filter</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="grayscale" 
                         src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80" 
                         alt="Ocean and beach">
                    <figcaption>Grayscale Filter</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="sepia" 
                         src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=600&q=80" 
                         alt="Forest landscape">
                    <figcaption>Sepia Filter</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="brightness" 
                         src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=80" 
                         alt="Mountain and lake">
                    <figcaption>Brightness Filter</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="contrast" 
                         src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80" 
                         alt="House near a lake">
                    <figcaption>Contrast Filter</figcaption>
                </figure>

                <figure class="gallery-item">
                    <img class="hue-rotate" 
                         src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=600&q=80" 
                         alt="Mountain peaks">
                    <figcaption>Hue-Rotate Filter</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 CSS Filter Gallery</p>
    </footer>

</body>
</html>
