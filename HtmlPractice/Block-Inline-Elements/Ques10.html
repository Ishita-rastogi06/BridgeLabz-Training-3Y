<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>

<body>

    <h1>Travel Selection Page</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
        <option value="canada">Canada</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="up" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="maharashtra">Maharashtra</option>
        <option value="rajasthan">Rajasthan</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="agra" selected>Agra</option>
        <option value="lucknow">Lucknow</option>
        <option value="varanasi">Varanasi</option>
        <option value="kanpur">Kanpur</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option value="tajmahal" selected>Taj Mahal</option>
        <option value="redfort">Red Fort</option>
        <option value="gateway">Gateway of India</option>
        <option value="indiagate">India Gate</option>
    </select>

    <br><br>

    <p>
        <b>My Choices:</b>
        I have selected <b>India</b> as my country,
        <b>Uttar Pradesh</b> as my state,
        <b>Agra</b> as my city, and
        <b>Taj Mahal</b> as my favorite tourist place.
    </p>

</body>
</html>
