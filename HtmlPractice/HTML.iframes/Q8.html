<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ishita Rastogi - Feedback Form</title>
</head>
<body>

    <!-- Student Name: Ishita Rastogi -->

    <h1>Feedback Form</h1>

    <p>Name: Ishita Rastogi</p>

    <form action="#" method="post">

        <label for="feedback">Your Feedback:</label>
        <br>
        <textarea
            id="feedback"
            name="feedback"
            rows="5"
            cols="40"
            required></textarea>

        <br><br>

        <p>Rate our website:</p>

        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label>

        <br>

        <input type="radio" id="average" name="rating" value="Average">
        <label for="average">Average</label>

        <br>

        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label>

        <br><br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
