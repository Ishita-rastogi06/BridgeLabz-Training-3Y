<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ishita Rastogi - File Upload</title>
</head>
<body>

    <!-- Student Name: Ishita Rastogi -->

    <h1>File Upload Form</h1>

    <p>Name: Ishita Rastogi</p>

    <form action="#" method="post" enctype="multipart/form-data">

        <label for="file">Choose a file:</label>
        <br><br>

        <input
            type="file"
            id="file"
            name="file"
            accept=".jpg,.png"
            required>

        <p>
            Only JPG and PNG image files are allowed.
        </p>

        <input type="submit" value="Upload File">

    </form>

</body>
</html>
