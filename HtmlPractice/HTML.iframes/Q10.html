<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ishita Rastogi - Contact Form</title>
</head>
<body>

    <!-- Student Name: Ishita Rastogi -->

    <h1>Contact Form</h1>

    <p>Name: Ishita Rastogi</p>

    <form action="#" method="post">

        <label for="fullname">Full Name:</label>
        <br>
        <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required>

        <br><br>

        <label for="email">Email:</label>
        <br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required>

        <br><br>

        <label for="subject">Subject:</label>
        <br>
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Enter subject"
            required>

        <br><br>

        <label for="message">Message:</label>
        <br>
        <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="Write your message here"
            required></textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

</body>
</html>
