<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>
    <h1> welcome </h1>

    <form>

        <label for="name"> Name </label> <br> 
        <input id="name" type="text" placeholder="Enter your name"  name="name" required> <br>

        <label for="email"> Email</label> <br>
        <input id="email" type="email" placeholder="Enter your email" name="email"> <br>
        
        <label for="pass">Password</label> <br>
        <input id="pass" type="password"> <br>

        <label for="phone">Phone no.</label> <br>
        <input id="phone" type="tel" name="phone"> <br>

        <label for="date">Date</label> <br>
        <input id="date" type="date" name="date"> <br>

        <label>Skill:</label> <br>
        <select name="skill">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="c++">C++</option>
        </select> <br>

        <section>
            <input id="html" type="checkbox" name="html">
            <label for="html">HTML</label>
            <input id="css" type="checkbox" name="css">
            <label for="css">CSS</label>
            <input id="js" type="checkbox" name="js">
            <label for="js">JavaScript</label>
        </section>

        <label>Gender:</label> <br>
        <section>
            <input type="radio" name="gender">
            <label>MALE</label>
            <input type="radio" name="gender">
            <label>FEMALE</label>

        </section>

        <input type="file" name="file"> <br>
        <input type="range" max="3" min="0">
        <input type="submit">
        <input type="reset">

        <br>
        <button type="submit"> Submit</button>

    </form>
</body>
</html>
